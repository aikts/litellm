name: Build and Push KTS Image

on:
  push:
    branches:
      - main
      - "kts"
      - "kts/**"
      - "kts_v*"
    tags:
      - "v*kts*"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream litellm-database tag to overlay on (e.g. v1.83.3-stable)"
        required: false
        type: string

env:
  UPSTREAM_IMAGE: ghcr.io/berriai/litellm-database
  # Default upstream tag for this stable branch. Override via workflow_dispatch input.
  DEFAULT_UPSTREAM_TAG: v1.83.3-stable

jobs:
  build-and-push-image-kts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve upstream base image tag
        id: base
        run: |
          TAG="${{ github.event.inputs.upstream_tag }}"
          if [ -z "$TAG" ]; then TAG="${DEFAULT_UPSTREAM_TAG}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Log in to private container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.KTS_REGISTRY_URL }}
          username: ${{ secrets.KTS_REGISTRY_USERNAME }}
          password: ${{ secrets.KTS_REGISTRY_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for KTS image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.KTS_REGISTRY_URL }}${{ secrets.KTS_REPOSITORY_PREFIX }}/litellm-database
            ghcr.io/${{ github.repository_owner }}/litellm-database
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push KTS overlay image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.kts
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE_IMAGE=${{ env.UPSTREAM_IMAGE }}:${{ steps.base.outputs.tag }}
            EXTRA_INDEX_URL=${{ secrets.KTS_PIP_EXTRA_INDEX_URL }}
            AP_LITELLM_MODULES_VERSION=0.2.1
