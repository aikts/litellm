name: Build and Push KTS Images

# Two-stage build:
#
#   1. "public" — overlays open-source patches on the upstream litellm-database
#      image. Pushed to ghcr.io. Built on every branch push and on every tag,
#      using the source ref name verbatim. NEVER includes private modules.
#
#   2. "kts" — adds the private ap-litellm-modules on top of the public image.
#      Pushed to the private KTS registry only. Built only on tags matching
#      "v*-kts.*" — never on branches, never to ghcr.io.

on:
  push:
    branches:
      - main
      - "kts"
      - "kts/**"
      - "kts_v*"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream litellm-database tag to overlay on (e.g. v1.83.10-stable)"
        required: false
        type: string

env:
  UPSTREAM_IMAGE: ghcr.io/berriai/litellm-database
  PUBLIC_IMAGE: ghcr.io/${{ github.repository_owner }}/litellm-database
  # Default upstream tag for this stable branch. Override via workflow_dispatch input.
  DEFAULT_UPSTREAM_TAG: v1.83.10-stable

jobs:
  build-public:
    name: Build and push public overlay image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      public_ref: ${{ steps.publicref.outputs.ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve upstream base image tag
        id: base
        run: |
          TAG="${{ github.event.inputs.upstream_tag }}"
          if [ -z "$TAG" ]; then TAG="${DEFAULT_UPSTREAM_TAG}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for public image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.PUBLIC_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push public overlay image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.public
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE_IMAGE=${{ env.UPSTREAM_IMAGE }}:${{ steps.base.outputs.tag }}

      - name: Expose public image ref by digest
        id: publicref
        run: |
          echo "ref=${PUBLIC_IMAGE}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  build-kts:
    name: Build and push KTS (private) image
    needs: build-public
    # Only run for tags that match "v*-kts.*" — never for branches.
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-kts.')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to private container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.KTS_REGISTRY_URL }}
          username: ${{ secrets.KTS_REGISTRY_USERNAME }}
          password: ${{ secrets.KTS_REGISTRY_PASSWORD }}

      - name: Extract metadata for KTS image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.KTS_REGISTRY_URL }}${{ secrets.KTS_REPOSITORY_PREFIX }}/litellm-database
          tags: |
            type=ref,event=tag
            type=sha,prefix=

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push KTS overlay image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.kts
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE_IMAGE=${{ needs.build-public.outputs.public_ref }}
            EXTRA_INDEX_URL=${{ secrets.KTS_PIP_EXTRA_INDEX_URL }}
